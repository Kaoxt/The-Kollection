name: Sync Kollection Images to Cloudflare R2

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - "scripts/sync_images_to_r2.py"
      - "tests/test_image_sync.py"
      - ".github/workflows/sync-images-to-r2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kollection-r2-image-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync changed images to R2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Check out current main with real image history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Test image sync regressions
        run: python3 -m unittest discover -s tests -p 'test_image_sync.py' -v

      - name: Install R2 S3 client
        run: python3 -m pip install 'boto3>=1.36,<2'

      - name: Sync changed content and repair artwork dates
        run: python3 scripts/sync_images_to_r2.py
