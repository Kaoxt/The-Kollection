name: Finalize World Backdrops

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-world-backdrops.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate WebP files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p images/World/Mexico images/World/Japan

          cat \
            .asset-staging/world-backgrounds-v3/mexico.00.b64 \
            .asset-staging/world-backgrounds-v3/mexico.01.b64 \
            .asset-staging/world-backgrounds-v3/mexico.02.b64 \
            .asset-staging/world-backgrounds-v3/mexico.03.b64 \
            .asset-staging/world-backgrounds-v3/mexico.04.b64 \
            .asset-staging/world-backgrounds-v3/mexico.05.b64 \
            | tr -d '\r\n' \
            | base64 --decode > /tmp/mexico.webp

          cat \
            .asset-staging/world-backgrounds-final/japan.00.b64 \
            .asset-staging/world-backgrounds-final/japan.00a.b64 \
            .asset-staging/world-backgrounds-final/japan.00b.b64 \
            .asset-staging/world-backgrounds-final/japan.01.b64 \
            .asset-staging/world-backgrounds-final/japan.02.b64 \
            .asset-staging/world-backgrounds-final/japan.03.b64 \
            .asset-staging/world-backgrounds-final/japan.04.b64 \
            .asset-staging/world-backgrounds-final/japan.04a.b64 \
            .asset-staging/world-backgrounds-final/japan.04b.b64 \
            .asset-staging/world-backgrounds-final/japan.05.b64 \
            | tr -d '\r\n' \
            | base64 --decode > /tmp/japan.webp

          echo '39232134bdf941b1e838a469684dff2637892e94beb94ab7850983e45499a4e7  /tmp/mexico.webp' | sha256sum --check
          echo '0f94e334176562a677671265301f09d6efafdb966a3f6afd2dfde23bdb4dfb38  /tmp/japan.webp' | sha256sum --check

          validate_webp() {
            python3 - "$1" <<'PY'
          import struct
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = path.read_bytes()
          if len(data) < 30 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit(f'{path}: invalid WebP header')

          declared = struct.unpack_from('<I', data, 4)[0] + 8
          if declared != len(data):
              raise SystemExit(f'{path}: invalid RIFF length')

          offset = 12
          width = height = None
          while offset + 8 <= len(data):
              chunk = data[offset:offset + 4]
              size = struct.unpack_from('<I', data, offset + 4)[0]
              payload = data[offset + 8:offset + 8 + size]
              if len(payload) != size:
                  raise SystemExit(f'{path}: truncated WebP chunk')
              if chunk == b'VP8X' and size >= 10:
                  width = 1 + int.from_bytes(payload[4:7], 'little')
                  height = 1 + int.from_bytes(payload[7:10], 'little')
                  break
              if chunk == b'VP8 ' and size >= 10 and payload[3:6] == b'\x9d\x01\x2a':
                  width = struct.unpack_from('<H', payload, 6)[0] & 0x3fff
                  height = struct.unpack_from('<H', payload, 8)[0] & 0x3fff
                  break
              if chunk == b'VP8L' and size >= 5 and payload[0] == 0x2f:
                  bits = int.from_bytes(payload[1:5], 'little')
                  width = 1 + (bits & 0x3fff)
                  height = 1 + ((bits >> 14) & 0x3fff)
                  break
              offset += 8 + size + (size & 1)

          if (width, height) != (1683, 934):
              raise SystemExit(f'{path}: expected 1683x934, found {width}x{height}')
          print(f'{path}: {width}x{height}, {len(data)} bytes')
          PY
          }

          validate_webp /tmp/mexico.webp
          validate_webp /tmp/japan.webp

          mv /tmp/mexico.webp images/World/Mexico/backdrop.webp
          mv /tmp/japan.webp images/World/Japan/backdrop.webp

          rm -rf \
            .asset-staging/world-backgrounds \
            .asset-staging/world-backgrounds-v2 \
            .asset-staging/world-backgrounds-v3 \
            .asset-staging/world-backgrounds-final

      - name: Commit finalized backdrops
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/World/Mexico/backdrop.webp images/World/Japan/backdrop.webp
          git add -A .asset-staging

          if git diff --cached --quiet; then
            echo 'No backdrop changes to commit.'
          else
            git commit -m 'Add Mexico and Japan World backdrops'
            git push origin HEAD:main
          fi

      - name: Ensure AWS CLI is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user awscli
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify R2 configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" || (echo 'Missing R2_ACCESS_KEY_ID' && exit 1)
          test -n "$AWS_SECRET_ACCESS_KEY" || (echo 'Missing R2_SECRET_ACCESS_KEY' && exit 1)
          test -n "$R2_ENDPOINT" || (echo 'Missing R2_ENDPOINT' && exit 1)
          test -n "$R2_BUCKET" || (echo 'Missing R2_BUCKET' && exit 1)

      - name: Upload World backdrops to Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp \
            'images/World/Mexico/backdrop.webp' \
            "s3://${R2_BUCKET}/images/World/Mexico/backdrop.webp" \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto \
            --content-type 'image/webp' \
            --cache-control 'public, max-age=2592000' \
            --only-show-errors

          aws s3 cp \
            'images/World/Japan/backdrop.webp' \
            "s3://${R2_BUCKET}/images/World/Japan/backdrop.webp" \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto \
            --content-type 'image/webp' \
            --cache-control 'public, max-age=2592000' \
            --only-show-errors

          echo 'Published Mexico and Japan backdrops to R2.'
